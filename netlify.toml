# Netlify configuration for lilyasite (Vue 3 + Vite SPA)
# Docs: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  command = "npm run build"
  publish = "dist"
  # Optional: specify the directory where functions (if added later) will live
  # functions = "netlify/functions"

[build.environment]
  # Ensure Node & npm versions are consistent (adjust if you target another version)
  NODE_VERSION = "18"
  NPM_FLAGS = "--no-audit --no-fund"
  # Custom environment variables (add in Netlify UI for secrets, not here):
  # VITE_API_BASE="https://api.example.com"

# Redirect all non-file requests to index.html for SPA routing
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = false

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security & caching headers
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "0"

# Example: custom 404 page (uncomment when you add a 404.html)
# [[redirects]]
#   from = "/404"
#   to = "/404.html"
#   status = 404

# Notes:
# - For environment secrets, set them in Netlify dashboard (Site settings > Build & deploy > Environment)
# - If you add serverless functions, create the directory and reference above.
# - For image optimization or edge functions, extend this config later.
